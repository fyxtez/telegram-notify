[package]
name = "telegram-notify"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Tiny async Rust crate for sending Telegram bot messages"
repository = "https://github.com/fyxtez/telegram-notify"
readme = "README.md"
keywords = ["telegram", "bot", "notifications", "alerting"]
categories = ["api-bindings", "network-programming"]

[dependencies]
teloxide = "0.17"
tokio = { version = "1.51.1", features = ["rt", "macros"] }